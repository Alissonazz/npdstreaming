services:

  postgres:
    image: postgres:17
    container_name: npdstreaming-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: npdstreaming
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d npdstreaming"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    container_name: npdstreaming-api
    restart: unless-stopped

    depends_on:
      postgres:
        condition: service_healthy

    ports:
      - "8080:8080"

    environment:
      DB_URL: jdbc:postgresql://postgres:5432/npdstreaming
      DB_PASSWORD: postgres
      OMDB_API_KEY: ${OMDB_API_KEY:-}

volumes:
  postgres_data: